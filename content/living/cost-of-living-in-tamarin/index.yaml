    faqs:
      - question: "La vie est chère à Tamarin ?"
        answer: "Il n’existe pas de chiffres officiels pour Tamarin seul. Selon les chiffres indicatifs de l’EDB pour Maurice, les loyers vont de 500 USD par mois pour une maison de 2 à 4 chambres à 2 400 USD pour une grande villa avec piscine ; demandez aux agents locaux où se situe Tamarin aujourd’hui."
      - question: "Quel loyer à Tamarin ?"
        answer: "Partez des chiffres indicatifs de l’EDB : 500 à 1 000 USD par mois pour une maison de 2 à 4 chambres, 1 200 à 2 400 USD pour une villa avec jardin et piscine. Certains bailleurs demandent aussi un dépôt et des frais d’agence."
      - question: "Combien coûtent les factures à Tamarin ?"
        answer: "Selon l’EDB : électricité 20 à 100 USD par mois selon la consommation, eau 3 à 6 USD pour une famille de trois ou quatre, internet environ 30 USD pour 20 Mbps."
      - question: "Faut il une voiture à Tamarin ?"
        answer: "C’est bien plus pratique. Le bus coûte environ 1 USD le ticket selon l’EDB, mais écoles, cliniques et commerces sont répartis le long de la côte. L’achat d’une voiture à Maurice est soumis à 100 % de droits d’accise."
    seoDescription: "Le coût de la vie à Tamarin, île Maurice : loyers, factures, courses et transport d’après les chiffres officiels de l’EDB, avec les écoles et la santé à proximité."
