    faqs:
      - question: "Is Tamarin expensive to live in?"
        answer: "No official figures exist for Tamarin alone. The EDB's indicative figures for Mauritius give rents from USD 500 a month for a 2 to 4 bedroom house to USD 2,400 for a large villa with a pool; ask local agents where Tamarin sits in that range today."
      - question: "How much is rent in Tamarin?"
        answer: "Use the EDB's indicative figures as a starting point: USD 500 to 1,000 a month for a house with 2 to 4 bedrooms, and USD 1,200 to 2,400 for a villa with a garden and pool. Some landlords also ask for a deposit and an agency fee."
      - question: "How much are utilities in Tamarin?"
        answer: "According to the EDB: electricity USD 20 to 100 a month depending on use, water USD 3 to 6 for a family of three to four, and internet around USD 30 for a 20 Mbps connection."
      - question: "Do I need a car in Tamarin?"
        answer: "It makes life much easier. Buses are cheap (about USD 1 a ticket, says the EDB), but schools, clinics and shops are spread along the coast. Note that buying a car in Mauritius comes with 100% excise duty."
    seoDescription: "Cost of living in Tamarin, Mauritius: rent, utilities, groceries and transport from the official EDB figures, plus schools and healthcare nearby."
  fr:
    title: "Combien coûte la vie à Tamarin ?"
    slug: cout-de-la-vie-a-tamarin
    excerpt: "Loyers, factures, courses, transport et écoles à Tamarin, d’après les chiffres indicatifs officiels pour Maurice."
    shortAnswer: "Il n’existe pas de chiffres officiels pour Tamarin seul. Les chiffres indicatifs de l’Economic Development Board pour Maurice donnent un loyer de 500 à 1 000 USD par mois pour une maison de 2 à 4 chambres et de 1 200 à 2 400 USD pour une villa avec jardin et piscine. L’électricité, l’eau et internet ajoutent environ 55 à 135 USD par mois. Les familles doivent ajouter les frais des écoles internationales, que les écoles communiquent sur demande."
