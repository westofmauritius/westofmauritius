  en:
    title: "How much does it cost to live in Tamarin?"
    slug: cost-of-living-in-tamarin
    excerpt: "Rent, utilities, groceries, transport and schools in Tamarin, using the official indicative figures for Mauritius."
    shortAnswer: "There are no official figures for Tamarin alone. The Economic Development Board's indicative figures for Mauritius put rent at USD 500 to 1,000 a month for a 2 to 4 bedroom house and USD 1,200 to 2,400 for a villa with a garden and pool. Electricity, water and internet add roughly USD 55 to 135 a month. Families should add international school fees, which the schools give on request."
