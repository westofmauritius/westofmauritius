    faqs:
      - question: "Quel secteur de la côte ouest pour une famille ?"
        answer: "Tamarin : deux écoles primaires internationales de la liste de l’Economic Development Board sont au village, et les écoles Westcoast International sont à Cascavelle et Médine, tout près. Flic en Flac est l’autre bon choix, plus proche de Port Louis."
      - question: "Quel secteur pour travailler à Port Louis ou Ebène ?"
        answer: "Flic en Flac, à environ 25 km de Port Louis et 17 km d’Ebène, le plus proche des six. Viennent ensuite Tamarin et Rivière Noire."
      - question: "Quel est le village le plus calme de la côte ouest ?"
        answer: "La Gaulette et Chamarel sont les plus petits et les plus paisibles de nos six secteurs ; Le Morne est le plus isolé de la côte."
      - question: "Fait il bon vivre sur la côte ouest de Maurice ?"
        answer: "Pour beaucoup, oui : c’est le côté le plus sec et le plus ensoleillé de l’île, à l’abri des alizés, avec le soleil qui se couche sur la mer, le parc national à l’intérieur, et des écoles, cliniques et un campus universitaire autour de Flic en Flac et Tamarin."
    seoDescription: "Où vivre sur la côte ouest de Maurice, secteur par secteur : pour qui, temps de trajet et écoles, par un Mauricien, avec des sources officielles."
