    faqs:
      - question: "Which west coast area is best for families?"
        answer: "Tamarin: two international primary schools on the Economic Development Board's list are in the village, and the Westcoast International schools are at Cascavelle and Medine nearby. Flic en Flac is the other strong choice, closer to Port Louis."
      - question: "Which area is best if I commute to Port Louis or Ebène?"
        answer: "Flic en Flac, about 25 km from Port Louis and 17 km from Ebène, the closest of the six. Tamarin and Black River come next."
      - question: "Which west coast village is the quietest?"
        answer: "La Gaulette and Chamarel are the smallest and slowest paced of our six areas; Le Morne is the most remote on the coast."
      - question: "Is the west coast of Mauritius a good place to live?"
        answer: "For many people, yes: it is the driest and sunniest side of the island, sheltered from the trade winds, with the sun setting over the sea, the national park inland, and schools, clinics and a university campus around Flic en Flac and Tamarin."
