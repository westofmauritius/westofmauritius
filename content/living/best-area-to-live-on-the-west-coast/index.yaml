content:
  en:
    title: "Where is the best place to live on the west coast of Mauritius?"
    slug: best-area-to-live-on-the-west-coast
    excerpt: "Flic en Flac, Tamarin, Black River, La Gaulette, Le Morne or Chamarel: which suits families, commuters, retirees, kitesurfers and nature lovers."
    shortAnswer: "It depends on how you live. For families, Tamarin has two international primary schools in the village. For commuters, Flic en Flac is the closest to Port Louis and Ebène. For a quiet life by the lagoon, La Gaulette; for beaches and kitesurfing, Le Morne; for nature, Black River; for cool air and hills, Chamarel."
