  fr:
    title: "Où vivre sur la côte ouest de Maurice ?"
    slug: ou-vivre-sur-la-cote-ouest
    excerpt: "Flic en Flac, Tamarin, Rivière Noire, La Gaulette, Le Morne ou Chamarel : quel village pour les familles, les actifs, les retraités, les kitesurfeurs et les amoureux de nature."
    shortAnswer: "Tout dépend de votre façon de vivre. Pour les familles, Tamarin compte deux écoles primaires internationales au village. Pour ceux qui travaillent à Port Louis ou Ebène, Flic en Flac est le plus proche. Pour une vie calme au bord du lagon, La Gaulette ; pour les plages et le kitesurf, Le Morne ; pour la nature, Rivière Noire ; pour la fraîcheur des hauteurs, Chamarel."
