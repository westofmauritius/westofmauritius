content:
  en:
    title: "Buying property in Flic en Flac as a foreigner"
    slug: buying-property-in-flic-en-flac
    excerpt: "How foreigners can buy a home in Flic en Flac, what the official lists show for the area, the costs on top of the price and what living here is like."
    shortAnswer: "Foreigners can buy in Flic en Flac through the PDS, IRS, RES or Smart City schemes, or an apartment of at least MUR 6 million in a building with at least two floors above ground. From USD 375,000 the purchase comes with a residence permit. No project on the EDB's November 2022 list of Real Estate Scheme projects is located in Flic en Flac itself."
    table:
      caption: "Buying in Flic en Flac at a glance"
      headers:
        - ""
        - "What to know"
      rows:
        - cells:
            - "Ways to buy as a foreigner"
            - "PDS, IRS, RES, Smart City, or a ground plus two apartment from MUR 6 million"
        - cells:
            - "Residence permit"
            - "From USD 375,000, while you own the home"
        - cells:
            - "RES projects on the EDB's 2022 list"
            - "0"
        - cells:
            - "Registration duty"
            - "5% under the PDS; under the IRS and RES, USD 70,000 or 5% on a first purchase, whichever is lower"
        - cells:
            - "Drive to Port Louis"
            - "About 25 km"
    faqs:
      - question: "Can foreigners buy property in Flic en Flac?"
        answer: "Yes, through the schemes approved by the Economic Development Board (PDS, IRS, RES and Smart City), or as an apartment of at least MUR 6 million in a building with at least two floors above the ground floor."
      - question: "Does buying in Flic en Flac give residency?"
        answer: "Yes, if the home costs USD 375,000 or more. The residence permit lasts as long as you own the property."
      - question: "Are there developments for foreigners in Flic en Flac?"
        answer: "No project on the EDB's November 2022 list of Real Estate Scheme projects is located in Flic en Flac itself. Medine Smart City (Uniciti), which the EDB lists under Flic en Flac, includes residential estates alongside its education village and business park."
      - question: "What does it cost to buy in Flic en Flac on top of the price?"
        answer: "Registration duty (5% under the PDS; under the IRS and RES the lower of USD 70,000 or 5% on a first purchase), the EDB's MUR 25,000 processing fee and notary fees."
    seoDescription: "Buying property in Flic en Flac, Mauritius, as a foreigner: the legal routes, the USD 375,000 residence permit, what the official lists show and the costs, by a local."
