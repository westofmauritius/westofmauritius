  en:
    title: "Tamarin vs Grand Baie: where should you live?"
    slug: tamarin-vs-grand-baie
    excerpt: "West or north? Tamarin and Grand Baie compared on feel, schools, clinics, property for foreign buyers and drive times."
    shortAnswer: "Grand Baie is the bigger, busier place in the north, with a shopping mall and the nearest drive to Port Louis. Tamarin is a smaller west coast village with surf, dolphins, two international primary schools and the sun setting over the sea. Both have many developments open to foreign buyers."
