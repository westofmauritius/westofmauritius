    faqs:
      - question: "Is Tamarin or Grand Baie better for families?"
        answer: "Both have international schools on the EDB's list: Paul et Virginie and Telfair primary schools in Tamarin, Saint Exupéry International School in Grand Baie. Grand Baie has a private clinic in the village; from Tamarin the nearest is about 9 km away."
      - question: "Which is closer to the airport?"
        answer: "Tamarin: about 51 km against about 71 km from Grand Baie, according to OpenStreetMap routing."
      - question: "Which is closer to Port Louis and Ebène?"
        answer: "Port Louis is a little closer from Grand Baie (about 27 km against 29), Ebène is closer from Tamarin (about 21 km against 42)."
      - question: "Can foreigners buy in both?"
        answer: "Yes. The EDB's 2022 list of Real Estate Scheme projects has 15 in Tamarin and 14 in Grand Baie, and both areas have other schemes too."
