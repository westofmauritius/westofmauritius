content:
  en:
    title: "Buying from abroad as a Mauritian"
    excerpt: "Coming home, or buying a place for the holidays while you live abroad: what is different for Mauritian citizens, and what the Mauritian Diaspora Scheme offers."
    shortAnswer: "As a Mauritian citizen you are not limited to the schemes for foreigners, and inside those schemes you may pay in rupees or in foreign currency. If you buy a serviced plot in a PDS project you have ten years to build, against five for foreigners. If you are moving back to work or start a business, look at the Mauritian Diaspora Scheme, which you must apply for before you return or within 180 days of starting work."
    table:
      caption: "Mauritian citizens and the schemes"
      headers:
        - ""
        - "For Mauritian citizens"
        - "For foreigners"
      rows:
        - cells:
            - "Where you can buy"
            - "Anywhere, including inside the schemes"
            - "Only through the schemes or ground plus two apartments"
        - cells:
            - "Currency inside the schemes"
            - "Rupees or foreign currency"
            - "Foreign currency from abroad"
        - cells:
            - "Serviced plot in a PDS project"
            - "Build within 10 years"
            - "Build within 5 years, one plot only"
    faqs:
      - question: "Do Mauritians living abroad need to use the PDS or IRS?"
        answer: "No. The schemes exist because Mauritian law restricts property purchases by foreigners. As a citizen you can buy outside them, and you may also buy inside them."
      - question: "Can a Mauritian pay in rupees for a PDS home?"
        answer: "Yes. The EDB guidelines say a citizen can buy a residential property under the schemes and pay in Mauritian rupees or any freely convertible foreign currency."
      - question: "What is the Mauritian Diaspora Scheme?"
        answer: "A government scheme to bring members of the Mauritian diaspora back to work or set up a business. You apply to the Economic Development Board as a professional, a self employed person or a young professional."
      - question: "When do I apply for the Diaspora Scheme?"
        answer: "Before you return to Mauritius, or no more than 180 days after you start your first job or register your first business here."
    seoDescription: "Buying property in Mauritius from abroad as a Mauritian: what differs from foreigners, paying in rupees, PDS plots and the Mauritian Diaspora Scheme. From EDB sources."
