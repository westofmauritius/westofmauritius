    faqs:
      - question: "Is Tamarin or Flic en Flac better for families?"
        answer: "Both work. Tamarin has two international primary schools on the EDB's list within the village; Flic en Flac is close to Westcoast International Primary School at Cascavelle and the secondary school at Medine."
      - question: "Which is closer to Port Louis?"
        answer: "Flic en Flac, about 25 km against about 29 km from Tamarin, according to OpenStreetMap routing."
      - question: "Which has the better beach?"
        answer: "For a long beach and a calm lagoon, Flic en Flac. Tamarin's bay is better known for its surf and its dolphins."
      - question: "How far apart are Tamarin and Flic en Flac?"
        answer: "About 12 km along the coast road, roughly a quarter of an hour by car."
