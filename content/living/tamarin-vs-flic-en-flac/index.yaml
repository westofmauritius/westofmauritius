    title: "Tamarin vs Flic en Flac: which is better to live in?"
    slug: tamarin-vs-flic-en-flac
    excerpt: "Two west coast villages twelve kilometres apart, compared on beaches, schools, healthcare, commuting and atmosphere."
    shortAnswer: "Choose Flic en Flac for a long beach and the shortest drive to Port Louis and Ebène; choose Tamarin for a village feel, surf and two international primary schools within the village. They are only about 12 km apart, so you can enjoy both."
