content:
  en:
    title: 'Tamarin vs Flic en Flac: which is better to live in?'
    slug: tamarin-vs-flic-en-flac
    excerpt: >-
      Two west coast villages twelve kilometres apart compared on beaches and
      schools and healthcare and commuting and atmosphere.
    shortAnswer: >-
      Choose Flic en Flac for a long beach and the shortest drive to Port Louis
      and Ebène. Choose Tamarin for a village feel and surf and two
      international primary schools within the village. They are only about 12
      km apart so you can enjoy both.
    table:
      caption: Tamarin and Flic en Flac side by side
      headers:
        - ''
        - Tamarin
        - Flic en Flac
      rows:
        - cells:
            - Feel
            - A lived in village on a bay
            - A long beach that is lively at weekends
        - cells:
            - The sea
            - Surf breaks and dolphins in the bay
            - A calm lagoon behind the reef
        - cells:
            - International schools (EDB list)
            - Two primary schools in the village
            - Primary at Cascavelle and secondary at Medine
        - cells:
            - Nearest private clinic
            - Artemis Cascavelle about 9 km away
            - Clinique de l'Occident in the village
        - cells:
            - Drive to Port Louis
            - About 29 km
            - About 25 km
        - cells:
            - Drive to Ebène
            - About 21 km
            - About 17 km
        - cells:
            - Drive to the airport
            - About 51 km
            - About 47 km
    faqs:
      - question: Is Tamarin or Flic en Flac better for families?
        answer: >-
          Both work. Tamarin has two international primary schools on the EDB's
          list within the village; Flic en Flac is close to Westcoast
          International Primary School at Cascavelle and the secondary school at
          Medine.
      - question: Which is closer to Port Louis?
        answer: >-
          Flic en Flac is about 25 km away against about 29 km from Tamarin
          according to OpenStreetMap routing.
      - question: Which has the better beach?
        answer: >-
          For a long beach and a calm lagoon Flic en Flac. Tamarin's bay is
          better known for its surf and its dolphins.
      - question: How far apart are Tamarin and Flic en Flac?
        answer: >-
          About 12 km along the coast road or roughly a quarter of an hour by
          car.
    seoDescription: >-
      Tamarin vs Flic en Flac: beaches and schools and clinics and drive times
      compared side by side for people moving to the west coast of Mauritius.
  fr:
    title: 'Tamarin ou Flic en Flac : où vivre ?'
    slug: tamarin-ou-flic-en-flac
    excerpt: >-
      Deux villages de la côte ouest à douze kilomètres l’un de l’autre,
      comparés : plages, écoles, santé, trajets et ambiance.
    shortAnswer: >-
      Choisissez Flic en Flac pour une longue plage et le trajet le plus court
      vers Port Louis et Ebène ; choisissez Tamarin pour l’esprit village, le
      surf et deux écoles primaires internationales au village. Ils ne sont qu’à
      environ 12 km l’un de l’autre.
    table:
      caption: Tamarin et Flic en Flac côte à côte
      headers:
        - ''
        - Tamarin
        - Flic en Flac
      rows:
        - cells:
            - Ambiance
            - Un vrai village sur une baie
            - Une longue plage, animée le week end
        - cells:
            - La mer
            - Spots de surf et dauphins dans la baie
            - Un lagon calme derrière le récif
        - cells:
            - Écoles internationales (liste EDB)
            - Deux écoles primaires au village
            - Primaire à Cascavelle, secondaire à Médine
        - cells:
            - Clinique privée la plus proche
            - Artemis Cascavelle, environ 9 km
            - Clinique de l’Occident, au village
        - cells:
            - Trajet vers Port Louis
            - Environ 29 km
            - Environ 25 km
        - cells:
            - Trajet vers Ebène
            - Environ 21 km
            - Environ 17 km
        - cells:
            - Trajet vers l’aéroport
            - Environ 51 km
            - Environ 47 km
    faqs:
      - question: Tamarin ou Flic en Flac pour une famille ?
        answer: >-
          Les deux conviennent. Tamarin compte deux écoles primaires
          internationales de la liste de l’EDB au village ; Flic en Flac est
          proche de Westcoast International Primary School à Cascavelle et de
          l’école secondaire à Médine.
      - question: Lequel est le plus proche de Port Louis ?
        answer: >-
          Flic en Flac, à environ 25 km contre environ 29 km depuis Tamarin,
          selon OpenStreetMap.
      - question: Lequel a la plus belle plage ?
        answer: >-
          Pour une longue plage et un lagon calme, Flic en Flac. La baie de
          Tamarin est surtout connue pour son surf et ses dauphins.
      - question: Quelle distance entre Tamarin et Flic en Flac ?
        answer: Environ 12 km par la route côtière, un quart d’heure en voiture.
    seoDescription: >-
      Tamarin ou Flic en Flac : plages, écoles, cliniques et temps de trajet
      comparés pour s’installer sur la côte ouest de Maurice.
