content:
  en:
    title: Retiring on the west coast of Mauritius
    slug: retiring-on-the-west-coast
    excerpt: >-
      The residence permit for retirees and what it costs and what you can buy.
      Plus which west coast village suits a quieter or a livelier retirement.
    shortAnswer: >-
      If you are 50 or older and can show an income of USD 2 000 a month (or USD
      24 000 a year) transferred to Mauritius you can apply for a ten year
      renewable residence permit as a retiree. After five years you can apply
      for a twenty year permanent residence permit. You can buy a home under the
      schemes for foreigners. On the west coast you can choose between a long
      beach and a quiet fishing village and the cooler hills of Chamarel.
    table:
      caption: Retiring in Mauritius at a glance
      headers:
        - ''
        - What the rules say
      rows:
        - cells:
            - Age
            - 50 or older
        - cells:
            - Income
            - "USD 2\_000 a month or USD 24\_000 a year transferred to a Mauritian bank"
        - cells:
            - Permit
            - 10 years and renewable
        - cells:
            - Permit fee
            - "USD 1\_000"
        - cells:
            - Permanent residence
            - "After 5 years if you have transferred at least USD 200\_000"
        - cells:
            - Working
            - You may invest in a business but not be employed by it
    faqs:
      - question: Can foreigners retire in Mauritius?
        answer: >-
          Yes. People aged 50 or older can apply for a residence permit as a
          retired non citizen by showing they have USD 2 000 a month or USD 24
          000 a year to transfer to Mauritius. It is valid for ten years and
          renewable.
      - question: Can retirees buy property in Mauritius?
        answer: >-
          Yes under the IRS or RES or PDS or Smart City schemes or as an
          apartment in a building of at least ground plus two floors. A home of
          USD 375 000 or more comes with its own residence permit.
      - question: Do I have to travel to Mauritius to apply?
        answer: >-
          No. The application starts online on the EDB's licensing platform and
          runs there up to the approval in principle.
      - question: Is my pension taxed in Mauritius?
        answer: >-
          You become tax resident after 183 days in a year (or 270 days over two
          years). Foreign income is taxable for residents; whether your pension
          is taxed depends on the tax treaty with your country and on whether
          the money is brought into Mauritius. Ask a tax adviser.
      - question: Which west coast village is best for retirees?
        answer: >-
          It depends on what you want each day. Flic en Flac has one of the
          longest beaches on the island and Tamarin is a village with a sea view
          and surfers. La Gaulette is a quiet village on the lagoon and Chamarel
          has cooler air in the hills.
    seoDescription: >-
      Retiring on the west coast of Mauritius: the retiree residence permit (age
      50 and USD 2 000 a month) and permanent residence. Buying a home and which
      village suits you.
  fr:
    title: Prendre sa retraite sur la côte ouest de Maurice
    slug: retraite-sur-la-cote-ouest
    excerpt: >-
      Le permis de résidence pour retraités, ce qu’il coûte, ce que l’on peut
      acheter, et quel village de la côte ouest choisir pour une retraite calme
      ou animée.
    shortAnswer: >-
      À partir de 50 ans, avec un revenu de 2 000 USD par mois (ou 24 000 USD
      par an) transféré à Maurice, vous pouvez demander un permis de résidence
      de retraité de dix ans, renouvelable. Après cinq ans, vous pouvez demander
      un permis de résidence permanente de vingt ans. Vous pouvez acheter un
      logement par les dispositifs pour étrangers, et choisir sur la côte ouest
      entre une longue plage, un village de pêcheurs tranquille ou la fraîcheur
      de Chamarel.
    table:
      caption: La retraite à Maurice en bref
      headers:
        - ''
        - Ce que disent les règles
      rows:
        - cells:
            - Âge
            - 50 ans ou plus
        - cells:
            - Revenu
            - >-
              2 000 USD par mois ou 24 000 USD par an transférés dans une banque
              mauricienne
        - cells:
            - Permis
            - 10 ans, renouvelable
        - cells:
            - Frais du permis
            - 1 000 USD
        - cells:
            - Résidence permanente
            - Après 5 ans, avec au moins 200 000 USD transférés
        - cells:
            - Travail
            - Investir dans une entreprise, sans y être salarié
    faqs:
      - question: Un étranger peut prendre sa retraite à Maurice ?
        answer: >-
          Oui. À partir de 50 ans, on peut demander un permis de résidence de
          retraité, valable dix ans et renouvelable, en montrant 2 000 USD par
          mois ou 24 000 USD par an à transférer à Maurice.
      - question: Un retraité peut acheter un bien à Maurice ?
        answer: >-
          Oui, sous l’IRS, le RES, le PDS ou le Smart City Scheme, ou un
          appartement dans un immeuble d’au moins deux étages. Un logement de
          375 000 USD ou plus donne son propre permis de résidence.
      - question: Faut il venir à Maurice pour faire la demande ?
        answer: >-
          Non. La demande commence en ligne sur la plateforme de l’EDB, jusqu’à
          l’accord de principe.
      - question: Ma pension est imposée à Maurice ?
        answer: >-
          On devient résident fiscal après 183 jours dans l’année (ou 270 jours
          sur deux ans). Les revenus étrangers sont imposables pour les
          résidents ; le traitement de votre pension dépend de la convention
          fiscale avec votre pays et du rapatriement de l’argent. Demandez
          conseil à un fiscaliste.
      - question: Quel village de la côte ouest pour la retraite ?
        answer: >-
          Selon ce que vous cherchez : l’une des plus longues plages de l’île
          (Flic en Flac), un village sur une baie avec ses surfeurs (Tamarin),
          un village calme sur le lagon (La Gaulette) ou la fraîcheur des
          hauteurs (Chamarel).
    seoDescription: >-
      Prendre sa retraite sur la côte ouest de Maurice : permis de retraité (50
      ans, 2 000 USD par mois), résidence permanente, achat et choix du village.
