content:
  en:
    title: Buying property in Le Morne as a foreigner
    slug: buying-property-in-le-morne
    excerpt: >-
      How foreigners can buy a home in Le Morne and what the official lists show
      for the area. The costs on top of the price and what living here is like.
    shortAnswer: >-
      Foreigners can buy in Le Morne through the PDS or IRS or RES or Smart City
      schemes. They can also buy an apartment of at least MUR 6 million in a
      building with at least two floors above ground. From USD 375 000 the
      purchase comes with a residence permit. No project on the EDB's November
      2022 list of Real Estate Scheme projects is located on the Le Morne
      peninsula. The nearest are in Black River and Tamarin.
    table:
      caption: Buying in Le Morne at a glance
      headers:
        - ''
        - What to know
      rows:
        - cells:
            - Ways to buy as a foreigner
            - >-
              PDS or IRS or RES or Smart City or a ground plus two apartment
              from MUR 6 million
        - cells:
            - Residence permit
            - "From USD 375\_000 while you own the home"
        - cells:
            - RES projects on the EDB's 2022 list
            - '0'
        - cells:
            - Registration duty
            - >-
              5% under the PDS. Under the IRS and RES it is USD 70 000 or 5% on
              a first purchase (whichever is lower)
        - cells:
            - Drive to Port Louis
            - About 48 km
    faqs:
      - question: Can foreigners buy property in Le Morne?
        answer: >-
          Yes through the schemes approved by the Economic Development Board
          (PDS and IRS and RES and Smart City) or as an apartment of at least
          MUR 6 million in a building with at least two floors above the ground
          floor.
      - question: Does buying in Le Morne give residency?
        answer: "Yes if the home costs USD 375\_000 or more. The residence permit lasts as long as you own the property."
      - question: Are there developments for foreigners in Le Morne?
        answer: >-
          No project on the EDB's November 2022 list of Real Estate Scheme
          projects is located on the Le Morne peninsula; the nearest are in
          Black River and Tamarin. There is no smart city on the peninsula; the
          nearest is Cap Tamarin.
      - question: What does it cost to buy in Le Morne on top of the price?
        answer: >-
          Registration duty (5% under the PDS and under the IRS and RES the
          lower of USD 70 000 or 5% on a first purchase) plus the EDB's MUR 25
          000 processing fee and notary fees.
    seoDescription: >-
      Buying property in Le Morne as a foreigner: the legal routes and the USD
      375 000 residence permit with what the official lists show and the costs.
      By a local.
  fr:
    title: Acheter un bien au Morne quand on est étranger
    slug: acheter-un-bien-le-morne
    excerpt: >-
      Comment un étranger peut acheter un logement au Morne, ce que montrent les
      listes officielles, les frais en plus du prix et la vie sur place.
    shortAnswer: >-
      Les étrangers peuvent acheter au Morne par le PDS, l’IRS, le RES ou le
      Smart City Scheme, ou un appartement d’au moins 6 millions MUR dans un
      immeuble d’au moins deux étages. Dès 375 000 USD, l’achat donne un permis
      de résidence. Aucun projet de la liste des projets RES de l’EDB de
      novembre 2022 n’est situé sur la presqu’île du Morne ; les plus proches
      sont à Rivière Noire et Tamarin.
    table:
      caption: Acheter au Morne en bref
      headers:
        - ''
        - À savoir
      rows:
        - cells:
            - Façons d’acheter pour un étranger
            - >-
              PDS, IRS, RES, Smart City, ou appartement en immeuble dès 6
              millions MUR
        - cells:
            - Permis de résidence
            - Dès 375 000 USD, tant que vous êtes propriétaire
        - cells:
            - Projets RES sur la liste 2022 de l’EDB
            - '0'
        - cells:
            - Droits d’enregistrement
            - >-
              5 % sous le PDS ; sous l’IRS et le RES, 70 000 USD ou 5 % pour un
              premier achat, le plus bas des deux
        - cells:
            - Trajet vers Port Louis
            - Environ 48 km
    faqs:
      - question: Un étranger peut acheter un bien au Morne ?
        answer: >-
          Oui, par les dispositifs agréés par l’Economic Development Board (PDS,
          IRS, RES et Smart City), ou en achetant un appartement d’au moins 6
          millions MUR dans un immeuble d’au moins deux étages au dessus du rez
          de chaussée.
      - question: Acheter au Morne donne la résidence ?
        answer: >-
          Oui, si le logement coûte 375 000 USD ou plus. Le permis dure tant que
          vous êtes propriétaire.
      - question: Y a t il des projets pour étrangers au Morne ?
        answer: >-
          Aucun projet de la liste des projets RES de l’EDB de novembre 2022
          n’est situé sur la presqu’île du Morne ; les plus proches sont à
          Rivière Noire et Tamarin. Il n’y a pas de smart city sur la presqu’île
          ; la plus proche est Cap Tamarin.
      - question: Quels frais en plus du prix au Morne ?
        answer: >-
          Les droits d’enregistrement (5 % sous le PDS ; sous l’IRS et le RES,
          70 000 USD ou 5 % pour un premier achat, le plus bas des deux), les
          frais de dossier de 25 000 MUR de l’EDB et les frais de notaire.
    seoDescription: >-
      Acheter un bien au Morne, île Maurice, quand on est étranger : voies
      légales, résidence dès 375 000 USD, listes officielles et frais.
