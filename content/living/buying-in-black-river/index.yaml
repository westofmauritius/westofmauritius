content:
  en:
    title: "Buying property in Black River as a foreigner"
    slug: buying-property-in-black-river
    excerpt: "How foreigners can buy a home in Black River, what the official lists show for the area, the costs on top of the price and what living here is like."
    shortAnswer: "Foreigners can buy in Black River through the PDS, IRS, RES or Smart City schemes, or an apartment of at least MUR 6 million in a building with at least two floors above ground. From USD 375,000 the purchase comes with a residence permit. 6 of the 77 projects on the EDB's November 2022 list of Real Estate Scheme projects are in Black River, including at La Preneuse, Cascavelle and Trois Bras."
    table:
      caption: "Buying in Black River at a glance"
      headers:
        - ""
        - "What to know"
      rows:
        - cells:
            - "Ways to buy as a foreigner"
            - "PDS, IRS, RES, Smart City, or a ground plus two apartment from MUR 6 million"
        - cells:
            - "Residence permit"
            - "From USD 375,000, while you own the home"
        - cells:
            - "RES projects on the EDB's 2022 list"
            - "6"
        - cells:
            - "Registration duty"
            - "5% under the PDS; under the IRS and RES, USD 70,000 or 5% on a first purchase, whichever is lower"
        - cells:
            - "Drive to Port Louis"
            - "About 33 km"
    faqs:
      - question: "Can foreigners buy property in Black River?"
        answer: "Yes, through the schemes approved by the Economic Development Board (PDS, IRS, RES and Smart City), or as an apartment of at least MUR 6 million in a building with at least two floors above the ground floor."
      - question: "Does buying in Black River give residency?"
        answer: "Yes, if the home costs USD 375,000 or more. The residence permit lasts as long as you own the property."
      - question: "Are there developments for foreigners in Black River?"
        answer: "6 of the 77 projects on the EDB's November 2022 list of Real Estate Scheme projects are in Black River, including at La Preneuse, Cascavelle and Trois Bras. The nearest smart cities are Cap Tamarin in Tamarin and Medine Smart City, which the EDB lists under Flic en Flac."
      - question: "What does it cost to buy in Black River on top of the price?"
        answer: "Registration duty (5% under the PDS; under the IRS and RES the lower of USD 70,000 or 5% on a first purchase), the EDB's MUR 25,000 processing fee and notary fees."
    seoDescription: "Buying property in Black River, Mauritius, as a foreigner: the legal routes, the USD 375,000 residence permit, what the official lists show and the costs, by a local."
