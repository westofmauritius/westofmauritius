content:
  en:
    title: A day in Chamarel and the hills
    excerpt: >-
      Leave the coast behind for a day. See a viewpoint over the lagoon and the
      Seven Coloured Earths and a 95 metre waterfall and the gorges of the
      national park.
    seoDescription: >-
      A day trip to Chamarel in west Mauritius: the viewpoint over Le Morne and
      the Seven Coloured Earths with Chamarel Falls and the Gorges Viewpoint.
  fr:
    title: Une journée à Chamarel et dans les hauteurs
    slug: une-journee-a-chamarel
    excerpt: >-
      Quittez la côte le temps d’une journée : un belvédère sur le lagon, la
      Terre des Sept Couleurs, une cascade de 95 mètres et les gorges du parc
      national.
    seoDescription: >-
      Une journée à Chamarel, ouest de l’île Maurice : le belvédère sur Le
      Morne, la Terre des Sept Couleurs, la cascade et le point de vue des
      Gorges.
