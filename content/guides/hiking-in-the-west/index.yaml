content:
  en:
    title: 'Hiking in the west: Le Morne and the gorges and the island''s highest peak'
    excerpt: >-
      The west has the island's best walking. There is a mountain on the UNESCO
      World Heritage List above the lagoon and the native forest of Black River
      Gorges and the highest summit in Mauritius.
    seoDescription: >-
      Hiking in west Mauritius: Le Morne Brabant and Black River Gorges National
      Park and Piton de la Petite Rivière Noire with routes and seasons and
      safety tips.
  fr:
    title: >-
      Randonner dans l’ouest : Le Morne, les gorges et le plus haut sommet de
      l’île
    slug: randonner-dans-l-ouest
    excerpt: >-
      L’ouest offre les plus belles randonnées de l’île : une montagne classée à
      l’UNESCO qui domine le lagon, la forêt indigène des Gorges de Rivière
      Noire et le plus haut sommet de Maurice.
    seoDescription: >-
      Randonner dans l’ouest de l’île Maurice : Morne Brabant, Gorges de Rivière
      Noire et Piton de la Petite Rivière Noire, avec itinéraires, saisons et
      sécurité.
