content:
  en:
    role: Mauritian, founder and editor
    shortBio: >-
      I'm Olivier, a Mauritian, and I write West of Mauritius so that visitors
      and people moving here get the west coast as it really is: every fact
      checked, every source shown, nothing paid for hidden.
    seoDescription: >-
      Olivier is the Mauritian founder and editor of West of Mauritius, an
      independent guide to the west coast of Mauritius for visitors and
      people moving there.
  fr:
    role: Mauricien, fondateur et rédacteur
    shortBio: >-
      Je m’appelle Olivier, je suis Mauricien, et j’écris Ouest Maurice pour
      que visiteurs et futurs résidents découvrent la côte ouest telle
      qu’elle est : chaque fait vérifié, chaque source citée, rien de payant
      caché.
    seoDescription: >-
      Olivier est le Mauricien fondateur et rédacteur d’Ouest Maurice, un
      guide indépendant de la côte ouest de l’île Maurice.
