content:
  en:
    role: Mauritian, founder and editor
    shortBio: >-
      I'm Olivier, and this is my guide to the west coast of Mauritius: the
      beaches, the villages, the sunsets and the everyday life in between.
    seoDescription: >-
      Olivier is the Mauritian founder and editor of West of Mauritius, an
      independent guide to the west coast of Mauritius for visitors and
      people moving there.
  fr:
    role: Mauricien, fondateur et rédacteur
    shortBio: >-
      Je m’appelle Olivier, et voici mon guide de la côte ouest de Maurice :
      les plages, les villages, les couchers de soleil et la vie de tous les
      jours entre les deux.
    seoDescription: >-
      Olivier est le Mauricien fondateur et rédacteur d’Ouest Maurice, un
      guide indépendant de la côte ouest de l’île Maurice.
