  content:
    en:
      shortAnswer: "Chamarel suits people who want cooler air, green hills and quiet: a small village on a plateau about 260 metres above the sea, next to the national park. Everything else means a drive down a winding road: Port Louis is about 45 km away."
      livingHere: "Chamarel is a small, quiet village on a plateau of forest, sugar cane and small farms where coffee and bananas grow. It is noticeably cooler and wetter than the coast.\n\nThe Seven Coloured Earths and Chamarel Falls draw visitors by day, the national park begins above the village, and the coast is a short, winding drive down to Case Noyale."
      schools: "No school on the Economic Development Board's list of international schools is in Chamarel. The nearest are the international primary schools in Tamarin, about 17 km away by road. Public primary and secondary schools are free, and teach mainly in English."
      healthcare: "The Economic Development Board lists two private clinics on this coast: Clinique de l'Occident on the Royal Road in Flic en Flac (about 28 km, roughly 36 minutes with no traffic) and Artemis Cascavelle Hospital in Cascavelle (about 25 km, roughly 33 minutes with no traffic). The nearest public regional hospital is Victoria Hospital in Quatre Bornes (about 33 km, roughly 40 minutes with no traffic). The SAMU emergency service covers the whole island: dial 114 for an ambulance. Pharmacies are found throughout the island."
      commuting: "By car, Port Louis is about 45 km, roughly 54 minutes with no traffic, Ebène about 37 km, roughly 46 minutes with no traffic and the international airport about 44 km, roughly 48 minutes with no traffic. Rush hour traffic towards Port Louis and Ebène can add a lot to these times. The coast at Case Noyale is a short drive down the hill; Tamarin is about 17 km away."
      pros:
        - "Cooler air than the coast"
        - "Forest, farms and the national park around you"
        - "A quiet village, with the views of the Case Noyale road"
      cons:
        - "A narrow, winding road down to the coast"
        - "More rain than on the coast"
        - "About 45 km to Port Louis and 25 km to the nearest clinic"
      faqs:
        - question: "Is Chamarel a good place to live?"
          answer: "For people who prefer cool air, forest and quiet to the beach, yes. It is a small village about 260 metres up, next to the national park. Daily commuting is harder: Port Louis is about 45 km away by a winding road."
        - question: "How much does it cost to live in Chamarel?"
          answer: "The Economic Development Board's indicative figures for Mauritius are USD 500 to 1,000 a month for a 2 to 4 bedroom house and USD 1,200 to 2,400 for a villa with a garden and pool. Ask local agents for current rents in Chamarel."
        - question: "Are there good schools near Chamarel?"
          answer: "There is no international school on the EDB's list in Chamarel. The nearest are the primary schools in Tamarin, about 17 km away by road."
        - question: "Where is the nearest hospital to Chamarel?"
          answer: "Artemis Cascavelle Hospital is about 25 km away and Clinique de l'Occident in Flic en Flac about 28 km. Victoria Hospital in Quatre Bornes is about 33 km."
        - question: "How long is the drive from Chamarel to Port Louis and Ebène?"
          answer: "About 45 km to Port Louis and 37 km to Ebène, roughly 54 and 46 minutes with no traffic, according to OpenStreetMap routing. The road down from the plateau is narrow and winding."
        - question: "Can foreigners buy property in Chamarel?"
          answer: "Yes. One of the projects on the EDB's 2022 list of Real Estate Scheme projects is in Chamarel. See our guide to buying property in Chamarel."
