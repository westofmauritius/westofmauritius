content:
  en:
    name: Chamarel
    tagline: Coloured earths, waterfalls and cool green hills
    intro: >-
      A small village on a wooded plateau some 260 metres above the sea, six
      kilometres inland. Chamarel is known for its Seven Coloured Earths and a
      95 metre waterfall, for its cooler air, and for the views from the winding
      road up from the coast.
    seoDescription: >-
      Chamarel, west Mauritius: the Seven Coloured Earths, the 95 metre Chamarel
      Falls, viewpoints over Le Morne and the way into Black River Gorges.
  fr:
    name: Chamarel
    tagline: Terres colorées, cascades et collines fraîches
    intro: >-
      Un petit village sur un plateau boisé, à quelque 260 mètres d’altitude et
      six kilomètres de la côte. Chamarel est connu pour sa Terre des Sept
      Couleurs et sa cascade de 95 mètres, pour sa fraîcheur et pour les vues de
      la route sinueuse qui y monte depuis la côte.
    seoDescription: >-
      Chamarel, ouest de l’île Maurice : la Terre des Sept Couleurs, la cascade
      de 95 mètres, les belvédères sur Le Morne et l’accès aux Gorges de Rivière
      Noire.
