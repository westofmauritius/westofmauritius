content:
  en:
    name: Tamarin
    tagline: Surf, salt pans and dolphins at dawn
    intro: >-
      A village on a wide bay where the Tamarin river meets the sea, ringed by
      mountains. The bay has a place in surfing history, the early mornings
      belong to the dolphins, and the old salt pans by the road recall how the
      coast once made its living.
    seoDescription: >-
      Tamarin, west Mauritius: a surf bay with history, dolphins in the early
      morning and the old salt pans. What the village is like and what to know.
  fr:
    name: Tamarin
    tagline: Surf, salines et dauphins à l’aube
    intro: >-
      Un village posé sur une large baie, là où la rivière Tamarin rejoint la
      mer, entouré de montagnes. La baie a sa place dans l’histoire du surf, le
      petit matin appartient aux dauphins, et les anciennes salines au bord de
      la route rappellent comment vivait la côte.
    seoDescription: >-
      Tamarin, ouest de l’île Maurice : une baie de surf mythique, des dauphins
      au petit matin et les anciennes salines. L’ambiance du village et nos
      conseils.
