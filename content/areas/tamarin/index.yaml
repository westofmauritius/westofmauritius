  content:
    en:
      shortAnswer: "Tamarin suits families and active people. Two international primary schools on the EDB's list are in the village, the bay has surf and dolphins, and Port Louis is about 29 km away. It feels like a village people live in rather than a resort."
      livingHere: "Tamarin is a lived in village around a wide bay ringed by mountains: Mauritian families, people from abroad who live here all year and a tight surf community share the same streets.\n\nMornings start early here, with surfers in the water and dolphins often in the bay before they head back out to sea. In the late afternoon the light on the mountains is at its best."
      schools: "The Economic Development Board's list of international schools includes two primary schools in Tamarin: Paul et Virginie Primary School on the Royal Road, and Telfair International Primary School at Morcellement Saltpans. For secondary school, Westcoast International Secondary School is at the Medine Education Village in Pierrefonds, near Flic en Flac. Public primary and secondary schools are free, and teach mainly in English."
      healthcare: "The Economic Development Board lists two private clinics on this coast: Clinique de l'Occident on the Royal Road in Flic en Flac (about 12 km, roughly 13 minutes with no traffic) and Artemis Cascavelle Hospital in Cascavelle (about 9 km, roughly 11 minutes with no traffic). The nearest public regional hospital is Victoria Hospital in Quatre Bornes (about 17 km, roughly 20 minutes with no traffic). The SAMU emergency service covers the whole island: dial 114 for an ambulance. Pharmacies are found throughout the island."
      commuting: "By car, Port Louis is about 29 km, roughly 32 minutes with no traffic, Ebène about 21 km, roughly 25 minutes with no traffic and the international airport about 51 km, roughly 47 minutes with no traffic. Rush hour traffic towards Port Louis and Ebène can add a lot to these times. Flic en Flac is about 12 km north along the coast."
      pros:
        - "Two international primary schools in the village"
        - "Surf, dolphins and the bay on your doorstep"
        - "A village atmosphere, with Black River and the national park next door"
      cons:
        - "Further from Port Louis and Ebène than Flic en Flac"
        - "The water in the bay can be less clear after heavy rain, where the river meets the sea"
        - "The surf breaks have a strong local lineup: for experienced surfers only"
      faqs:
        - question: "Is Tamarin a good place to live?"
          answer: "For families and people who love the sea, yes: two international primary schools on the EDB's list are in the village, the bay has surf and dolphins, and it feels like a real village rather than a resort. Port Louis is about 29 km away."
        - question: "How much does it cost to live in Tamarin?"
          answer: "The Economic Development Board's indicative figures for Mauritius are USD 500 to 1,000 a month to rent a 2 to 4 bedroom house, and USD 1,200 to 2,400 for a villa with a garden and pool. See our page on the cost of living in Tamarin for more."
        - question: "Are there good schools near Tamarin?"
          answer: "Two international primary schools on the EDB's list are in Tamarin: Paul et Virginie Primary School and Telfair International Primary School. Westcoast International Secondary School is at Medine, near Flic en Flac."
        - question: "Where is the nearest hospital to Tamarin?"
          answer: "Artemis Cascavelle Hospital, a private hospital, is about 9 km away, and Clinique de l'Occident in Flic en Flac about 12 km. The nearest public regional hospital is Victoria Hospital in Quatre Bornes, about 17 km."
        - question: "How long is the drive from Tamarin to Port Louis and Ebène?"
          answer: "About 29 km to Port Louis and 21 km to Ebène, roughly 32 and 25 minutes with no traffic, according to OpenStreetMap routing. Rush hour can add a lot."
        - question: "Can foreigners buy property in Tamarin?"
          answer: "Yes. Tamarin has many developments approved for foreign buyers: 15 of the 77 projects on the EDB's 2022 list of Real Estate Scheme projects are in Tamarin, and the Cap Tamarin smart city is here. See our guide to buying property in Tamarin."
