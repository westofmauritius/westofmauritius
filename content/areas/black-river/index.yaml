  content:
    en:
      shortAnswer: "Black River suits people who want the sea and the mountains at once: the island's main big game fishing harbour, La Preneuse beach, and the largest national park on the doorstep. Artemis Cascavelle Hospital is about 13 km away and Tamarin's schools just up the road."
      livingHere: "Black River is the working heart of the west coast: fishing boats head out beyond the reef, and La Preneuse beach, with its Martello tower, is a local favourite at sunset.\n\nInland rise the forests and ravines of the Black River Gorges National Park, with some 60 km of trails, so hikes and early morning birdwatching are part of everyday life here."
      schools: "No school on the Economic Development Board's list of international schools is in Black River itself, but the two international primary schools in Tamarin, Paul et Virginie and Telfair, are about 4 km away. Westcoast International Primary School is at Cascavelle and the secondary school at Medine, near Flic en Flac. Public primary and secondary schools are free, and teach mainly in English."
      healthcare: "The Economic Development Board lists two private clinics on this coast: Clinique de l'Occident on the Royal Road in Flic en Flac (about 15 km, roughly 18 minutes with no traffic) and Artemis Cascavelle Hospital in Cascavelle (about 13 km, roughly 15 minutes with no traffic). The nearest public regional hospital is Victoria Hospital in Quatre Bornes (about 21 km, roughly 25 minutes with no traffic). The SAMU emergency service covers the whole island: dial 114 for an ambulance. Pharmacies are found throughout the island."
      commuting: "By car, Port Louis is about 33 km, roughly 37 minutes with no traffic, Ebène about 25 km, roughly 30 minutes with no traffic and the international airport about 55 km, roughly 52 minutes with no traffic. Rush hour traffic towards Port Louis and Ebène can add a lot to these times. Tamarin is about 4 km north."
      pros:
        - "The national park and its trails right behind the village"
        - "Big game fishing and boat life"
        - "Tamarin's schools a few minutes away"
      cons:
        - "About 33 km from Port Louis, so a longer commute"
        - "The uplands can be wet even when the coast is dry"
        - "Fewer services in the village itself than in Flic en Flac"
      faqs:
        - question: "Is Black River a good place to live?"
          answer: "Yes, if you want nature on your doorstep: the national park, the sea and boat life, with Tamarin's schools a few minutes away. The trade off is a longer drive to Port Louis and Ebène."
        - question: "How much does it cost to live in Black River?"
          answer: "The Economic Development Board's indicative figures for Mauritius are USD 500 to 1,000 a month for a 2 to 4 bedroom house and USD 1,200 to 2,400 for a villa with a garden and pool. Ask local agents for current rents in Black River."
        - question: "Are there good schools near Black River?"
          answer: "The nearest international schools on the EDB's list are the two primary schools in Tamarin, about 4 km away, and the Westcoast International schools at Cascavelle and Medine."
        - question: "Where is the nearest hospital to Black River?"
          answer: "Artemis Cascavelle Hospital is about 13 km away and Clinique de l'Occident in Flic en Flac about 15 km. The nearest public regional hospital is Victoria Hospital in Quatre Bornes, about 21 km."
        - question: "How long is the drive from Black River to Port Louis and Ebène?"
          answer: "About 33 km to Port Louis and 25 km to Ebène, roughly 37 and 30 minutes with no traffic, according to OpenStreetMap routing."
        - question: "Can foreigners buy property in Black River?"
          answer: "Yes. Six of the 77 projects on the EDB's 2022 list of Real Estate Scheme projects are in Black River, including at La Preneuse and Cascavelle. See our guide to buying property in Black River."
