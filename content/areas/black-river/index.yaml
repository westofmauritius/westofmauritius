content:
  en:
    name: Black River
    tagline: Fishing boats, a British tower and the way to the gorges
    intro: >-
      Black River, or Rivière Noire in French, is the working heart of the west
      coast: the base for big game fishing boats, home to La Preneuse beach and
      its Martello tower from the 19th century, and the gateway to the island's
      largest national park.
    seoDescription: >-
      Black River (Rivière Noire), west Mauritius: big game fishing, La Preneuse
      beach and its Martello tower, and Black River Gorges National Park.
  fr:
    name: Rivière Noire
    tagline: Bateaux de pêche, tour anglaise et route des gorges
    intro: >-
      Rivière Noire est le cœur actif de la côte ouest : le port d’attache des
      bateaux de pêche au gros, la plage de La Preneuse et sa tour Martello du
      XIXe siècle, et la porte d’entrée du plus grand parc national de l’île.
    seoDescription: >-
      Rivière Noire, ouest de l’île Maurice : pêche au gros, la plage de La
      Preneuse et sa tour Martello, et le parc national des Gorges de Rivière
      Noire.
