  content:
    en:
      shortAnswer: "La Gaulette suits people who want quiet and the lagoon: a small fishing village between the mountains and the sea, close to Le Morne and Chamarel. The trade off is distance: Port Louis is about 41 km away and the nearest clinic about 22 km."
      livingHere: "La Gaulette has kept the feel of a fishing village: small shops, pirogues pulled up on the shore and a slower pace than the resorts further south.\n\nDays here follow the lagoon: boat trips to Île aux Bénitiers and the Crystal Rock in the calm mornings, kitesurfing when the winter trade winds blow, and the winding road up to Chamarel behind the village."
      schools: "No school on the Economic Development Board's list of international schools is in La Gaulette. The nearest are the international primary schools in Tamarin, about 13 km away. Public primary and secondary schools are free, and teach mainly in English."
      healthcare: "The Economic Development Board lists two private clinics on this coast: Clinique de l'Occident on the Royal Road in Flic en Flac (about 24 km, roughly 28 minutes with no traffic) and Artemis Cascavelle Hospital in Cascavelle (about 22 km, roughly 25 minutes with no traffic). The nearest public regional hospital is Victoria Hospital in Quatre Bornes (about 30 km, roughly 35 minutes with no traffic). The SAMU emergency service covers the whole island: dial 114 for an ambulance. Pharmacies are found throughout the island."
      commuting: "By car, Port Louis is about 41 km, roughly 47 minutes with no traffic, Ebène about 34 km, roughly 40 minutes with no traffic and the international airport about 49 km, roughly 56 minutes with no traffic. Rush hour traffic towards Port Louis and Ebène can add a lot to these times. Tamarin is about 13 km north."
      pros:
        - "A quiet village with a real local life"
        - "The lagoon, the islets and Le Morne close by"
        - "Kitesurfing and boat trips on the doorstep"
      cons:
        - "About 41 km from Port Louis and 34 km from Ebène"
        - "The nearest clinic is about 22 km away, in Cascavelle"
        - "Few services in the village; bigger shops mean a drive north"
      faqs:
        - question: "Is La Gaulette a good place to live?"
          answer: "For a quiet life by the lagoon, yes. It is a small, unhurried fishing village close to Le Morne and Chamarel. It suits people who work from home or are retired better than daily commuters."
        - question: "How much does it cost to live in La Gaulette?"
          answer: "The Economic Development Board's indicative figures for Mauritius are USD 500 to 1,000 a month for a 2 to 4 bedroom house and USD 1,200 to 2,400 for a villa with a garden and pool. Ask local agents for current rents in La Gaulette."
        - question: "Are there good schools near La Gaulette?"
          answer: "There is no international school on the EDB's list in La Gaulette. The nearest are Paul et Virginie and Telfair primary schools in Tamarin, about 13 km away."
        - question: "Where is the nearest hospital to La Gaulette?"
          answer: "Artemis Cascavelle Hospital is about 22 km away and Clinique de l'Occident in Flic en Flac about 24 km. Victoria Hospital in Quatre Bornes, the nearest public regional hospital, is about 30 km."
        - question: "How long is the drive from La Gaulette to Port Louis and Ebène?"
          answer: "About 41 km to Port Louis and 34 km to Ebène, roughly 47 and 40 minutes with no traffic, according to OpenStreetMap routing."
        - question: "Can foreigners buy property in La Gaulette?"
          answer: "Yes, through the schemes for foreign buyers or an apartment of at least MUR 6 million in a building with at least two floors above ground. See our guide to buying property in La Gaulette."
    fr:
      shortAnswer: "La Gaulette convient à celles et ceux qui cherchent le calme et le lagon : un petit village de pêcheurs entre les montagnes et la mer, près du Morne et de Chamarel. La contrepartie, c’est la distance : Port Louis est à environ 41 km et la clinique la plus proche à environ 22 km."
      livingHere: "La Gaulette a gardé l’allure d’un village de pêcheurs : petites boutiques, pirogues tirées sur le rivage et un rythme plus lent que les stations plus au sud.\n\nLes journées suivent le lagon : sorties en bateau vers l’île aux Bénitiers et le Crystal Rock par mer calme le matin, kitesurf quand soufflent les alizés d’hiver, et la route sinueuse de Chamarel derrière le village."
      schools: "Aucune école de la liste des écoles internationales de l’Economic Development Board n’est à La Gaulette. Les plus proches sont les écoles primaires internationales de Tamarin, à environ 13 km. Les écoles publiques primaires et secondaires sont gratuites et enseignent surtout en anglais."
      healthcare: "L’Economic Development Board liste deux cliniques privées sur cette côte : la Clinique de l’Occident, sur la Royal Road à Flic en Flac (environ 24 km, soit 28 minutes sans circulation), et l’hôpital Artemis Cascavelle, à Cascavelle (environ 22 km, soit 25 minutes sans circulation). L’hôpital public régional le plus proche est l’hôpital Victoria à Quatre Bornes (environ 30 km, soit 35 minutes sans circulation). Le SAMU couvre toute l’île : composez le 114 pour une ambulance. On trouve des pharmacies partout."
      commuting: "En voiture, Port Louis est à environ 41 km, soit 47 minutes sans circulation, Ebène à environ 34 km, soit 40 minutes sans circulation et l’aéroport international à environ 49 km, soit 56 minutes sans circulation. Aux heures de pointe, les trajets vers Port Louis et Ebène peuvent être bien plus longs. Tamarin est à environ 13 km au nord."
      pros:
        - "Un village calme, avec une vraie vie locale"
        - "Le lagon, les îlots et Le Morne tout près"
        - "Kitesurf et sorties en bateau à votre porte"
      cons:
        - "Environ 41 km de Port Louis et 34 km d’Ebène"
        - "La clinique la plus proche est à environ 22 km, à Cascavelle"
        - "Peu de services au village : les grandes courses demandent de rouler vers le nord"
      faqs:
        - question: "Fait il bon vivre à La Gaulette ?"
          answer: "Pour une vie calme au bord du lagon, oui. C’est un petit village de pêcheurs paisible, près du Morne et de Chamarel. Il convient mieux au télétravail ou à la retraite qu’aux trajets quotidiens."
        - question: "Combien coûte la vie à La Gaulette ?"
          answer: "Les chiffres indicatifs de l’Economic Development Board pour Maurice : 500 à 1 000 USD par mois pour une maison de 2 à 4 chambres, 1 200 à 2 400 USD pour une villa avec jardin et piscine. Demandez aux agents locaux les loyers actuels à La Gaulette."
        - question: "Quelles écoles près de La Gaulette ?"
          answer: "Il n’y a pas d’école internationale de la liste de l’EDB à La Gaulette. Les plus proches sont les écoles primaires Paul et Virginie et Telfair à Tamarin, à environ 13 km."
        - question: "Où est l’hôpital le plus proche de La Gaulette ?"
          answer: "L’hôpital Artemis Cascavelle est à environ 22 km et la Clinique de l’Occident à Flic en Flac à environ 24 km. L’hôpital Victoria à Quatre Bornes, l’hôpital public régional le plus proche, est à environ 30 km."
        - question: "Combien de temps de La Gaulette à Port Louis et Ebène ?"
          answer: "Environ 41 km jusqu’à Port Louis et 34 km jusqu’à Ebène, soit environ 47 et 40 minutes sans circulation, selon OpenStreetMap."
        - question: "Un étranger peut acheter un bien à La Gaulette ?"
          answer: "Oui, par les dispositifs pour acheteurs étrangers ou un appartement d’au moins 6 millions MUR dans un immeuble d’au moins deux étages. Voyez notre guide pour acheter un bien à La Gaulette."
content:
  en:
    name: La Gaulette
    tagline: A fishing village on Le Morne's lagoon
    intro: >-
      A small, unhurried village between the mountains and a wide lagoon. From
      here, boats head out to Île aux Bénitiers and the Crystal Rock,
      kitesurfers to the waters off Le Morne, and the road climbs up to
      Chamarel.
    seoDescription: >-
      La Gaulette, west Mauritius: a quiet fishing village, boat trips to Île
      aux Bénitiers and the Crystal Rock, kitesurfing and the road to Chamarel.
  fr:
    name: La Gaulette
    tagline: Un village de pêcheurs sur le lagon du Morne
    intro: >-
      Un petit village tranquille entre les montagnes et un vaste lagon. D’ici
      partent les bateaux pour l’île aux Bénitiers et le Crystal Rock, les
      kitesurfeurs vers les eaux du Morne, et la route qui grimpe à Chamarel.
    seoDescription: >-
      La Gaulette, ouest de l’île Maurice : un village de pêcheurs paisible,
      l’île aux Bénitiers et le Crystal Rock, le kitesurf et la route de
      Chamarel.
