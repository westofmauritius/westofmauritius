content:
  en:
    name: La Gaulette
    tagline: A fishing village on Le Morne's lagoon
    intro: >-
      A small, unhurried village between the mountains and a wide lagoon. From
      here, boats head out to Île aux Bénitiers and the Crystal Rock,
      kitesurfers to the waters off Le Morne, and the road climbs up to
      Chamarel.
    seoDescription: >-
      La Gaulette, west Mauritius: a quiet fishing village, boat trips to Île
      aux Bénitiers and the Crystal Rock, kitesurfing and the road to Chamarel.
  fr:
    name: La Gaulette
    tagline: Un village de pêcheurs sur le lagon du Morne
    intro: >-
      Un petit village tranquille entre les montagnes et un vaste lagon. D’ici
      partent les bateaux pour l’île aux Bénitiers et le Crystal Rock, les
      kitesurfeurs vers les eaux du Morne, et la route qui grimpe à Chamarel.
    seoDescription: >-
      La Gaulette, ouest de l’île Maurice : un village de pêcheurs paisible,
      l’île aux Bénitiers et le Crystal Rock, le kitesurf et la route de
      Chamarel.
