  content:
    en:
      shortAnswer: "La Gaulette suits people who want quiet and the lagoon: a small fishing village between the mountains and the sea, close to Le Morne and Chamarel. The trade off is distance: Port Louis is about 41 km away and the nearest clinic about 22 km."
      livingHere: "La Gaulette has kept the feel of a fishing village: small shops, pirogues pulled up on the shore and a slower pace than the resorts further south.\n\nDays here follow the lagoon: boat trips to Île aux Bénitiers and the Crystal Rock in the calm mornings, kitesurfing when the winter trade winds blow, and the winding road up to Chamarel behind the village."
      schools: "No school on the Economic Development Board's list of international schools is in La Gaulette. The nearest are the international primary schools in Tamarin, about 13 km away. Public primary and secondary schools are free, and teach mainly in English."
      healthcare: "The Economic Development Board lists two private clinics on this coast: Clinique de l'Occident on the Royal Road in Flic en Flac (about 24 km, roughly 28 minutes with no traffic) and Artemis Cascavelle Hospital in Cascavelle (about 22 km, roughly 25 minutes with no traffic). The nearest public regional hospital is Victoria Hospital in Quatre Bornes (about 30 km, roughly 35 minutes with no traffic). The SAMU emergency service covers the whole island: dial 114 for an ambulance. Pharmacies are found throughout the island."
      commuting: "By car, Port Louis is about 41 km, roughly 47 minutes with no traffic, Ebène about 34 km, roughly 40 minutes with no traffic and the international airport about 49 km, roughly 56 minutes with no traffic. Rush hour traffic towards Port Louis and Ebène can add a lot to these times. Tamarin is about 13 km north."
      pros:
        - "A quiet village with a real local life"
        - "The lagoon, the islets and Le Morne close by"
        - "Kitesurfing and boat trips on the doorstep"
      cons:
        - "About 41 km from Port Louis and 34 km from Ebène"
        - "The nearest clinic is about 22 km away, in Cascavelle"
        - "Few services in the village; bigger shops mean a drive north"
      faqs:
        - question: "Is La Gaulette a good place to live?"
          answer: "For a quiet life by the lagoon, yes. It is a small, unhurried fishing village close to Le Morne and Chamarel. It suits people who work from home or are retired better than daily commuters."
        - question: "How much does it cost to live in La Gaulette?"
          answer: "The Economic Development Board's indicative figures for Mauritius are USD 500 to 1,000 a month for a 2 to 4 bedroom house and USD 1,200 to 2,400 for a villa with a garden and pool. Ask local agents for current rents in La Gaulette."
        - question: "Are there good schools near La Gaulette?"
          answer: "There is no international school on the EDB's list in La Gaulette. The nearest are Paul et Virginie and Telfair primary schools in Tamarin, about 13 km away."
        - question: "Where is the nearest hospital to La Gaulette?"
          answer: "Artemis Cascavelle Hospital is about 22 km away and Clinique de l'Occident in Flic en Flac about 24 km. Victoria Hospital in Quatre Bornes, the nearest public regional hospital, is about 30 km."
        - question: "How long is the drive from La Gaulette to Port Louis and Ebène?"
          answer: "About 41 km to Port Louis and 34 km to Ebène, roughly 47 and 40 minutes with no traffic, according to OpenStreetMap routing."
        - question: "Can foreigners buy property in La Gaulette?"
          answer: "Yes, through the schemes for foreign buyers or an apartment of at least MUR 6 million in a building with at least two floors above ground. See our guide to buying property in La Gaulette."
