content:
  en:
    name: Le Morne
    tagline: The mountain, the lagoon and a place of memory
    intro: >-
      The basalt mass of Le Morne Brabant rises 556 metres above a turquoise
      lagoon at the southwest tip of the island. A UNESCO World Heritage Site
      and a symbol of the resistance to slavery, it is also home to some of the
      finest beaches and kitesurfing waters in Mauritius.
    seoDescription: >-
      Le Morne, Mauritius: the UNESCO World Heritage mountain and its history,
      the public beach, kitesurfing and the hike up Le Morne Brabant. What to
      know before you go.
  fr:
    name: Le Morne
    tagline: La montagne, le lagon et un lieu de mémoire
    intro: >-
      La masse basaltique du Morne Brabant s’élève à 556 mètres et domine un
      lagon turquoise, à l’extrémité sud de la côte ouest. Inscrit au patrimoine
      mondial de l’UNESCO et symbole de la résistance à l’esclavage, Le Morne
      compte aussi parmi les plus belles plages et les meilleurs spots de
      kitesurf de Maurice.
    seoDescription: >-
      Le Morne, île Maurice : la montagne classée à l’UNESCO et son histoire, la
      plage publique, le kitesurf et l’ascension du Morne Brabant. Nos conseils.
