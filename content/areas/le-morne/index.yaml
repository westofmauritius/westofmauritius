  content:
    en:
      shortAnswer: "Le Morne suits people who want some of the finest beaches and kitesurfing waters in Mauritius, below a UNESCO listed mountain. It is the most remote of our coastal areas: Port Louis is about 48 km away and the nearest clinic about 28 km."
      livingHere: "Le Morne is a peninsula almost entirely surrounded by a lagoon, dominated by the basalt mass of Le Morne Brabant. Life here is about the water: swimming off the public beach, and kitesurfing on the lagoon when the winter trade winds blow.\n\nIt is also a place of memory. The mountain is a symbol of the resistance to slavery, and the Le Morne Cultural Landscape is a UNESCO World Heritage Site."
      schools: "No school on the Economic Development Board's list of international schools is on the Le Morne peninsula. The nearest are the international primary schools in Tamarin, about 20 km away. Public primary and secondary schools are free, and teach mainly in English."
      healthcare: "The Economic Development Board lists two private clinics on this coast: Clinique de l'Occident on the Royal Road in Flic en Flac (about 30 km, roughly 35 minutes with no traffic) and Artemis Cascavelle Hospital in Cascavelle (about 28 km, roughly 32 minutes with no traffic). The nearest public regional hospital is Victoria Hospital in Quatre Bornes (about 36 km, roughly 42 minutes with no traffic). The SAMU emergency service covers the whole island: dial 114 for an ambulance. Pharmacies are found throughout the island."
      commuting: "By car, Port Louis is about 48 km, roughly 53 minutes with no traffic, Ebène about 40 km, roughly 46 minutes with no traffic and the international airport about 55 km, roughly 62 minutes with no traffic. Rush hour traffic towards Port Louis and Ebène can add a lot to these times. Tamarin is about 20 km north."
      pros:
        - "Some of the finest beaches on the island"
        - "World class kitesurfing on the lagoon"
        - "A UNESCO listed landscape, with hiking on Le Morne Brabant"
      cons:
        - "The most remote of our coastal areas: about 48 km to Port Louis"
        - "The nearest clinic is about 28 km away"
        - "Few everyday services nearby"
      faqs:
        - question: "Is Le Morne a good place to live?"
          answer: "For beaches, kitesurfing and nature, few places compare. It is remote, though: about 48 km from Port Louis and 28 km from the nearest clinic, so it suits people who do not commute daily."
        - question: "How much does it cost to live in Le Morne?"
          answer: "The Economic Development Board's indicative figures for Mauritius are USD 500 to 1,000 a month for a 2 to 4 bedroom house and USD 1,200 to 2,400 for a villa with a garden and pool. Ask local agents for current rents on the peninsula."
        - question: "Are there good schools near Le Morne?"
          answer: "There is no international school on the EDB's list on the peninsula. The nearest are the primary schools in Tamarin, about 20 km away."
        - question: "Where is the nearest hospital to Le Morne?"
          answer: "Artemis Cascavelle Hospital is about 28 km away and Clinique de l'Occident in Flic en Flac about 30 km. Victoria Hospital in Quatre Bornes is about 36 km."
        - question: "How long is the drive from Le Morne to Port Louis and Ebène?"
          answer: "About 48 km to Port Louis and 40 km to Ebène, roughly 53 and 46 minutes with no traffic, according to OpenStreetMap routing."
        - question: "Can foreigners buy property in Le Morne?"
          answer: "Yes, through the schemes for foreign buyers or an apartment of at least MUR 6 million in a building with at least two floors above ground. See our guide to buying property in Le Morne."
