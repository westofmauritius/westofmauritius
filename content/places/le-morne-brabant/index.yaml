content:
  en:
    name: Le Morne Brabant
    summary: >-
      A 556-metre basalt mountain at the south-west tip of the island, a refuge
      for people escaping slavery and a UNESCO World Heritage Site.
    hoursNote: 'Hiking access is regulated at times: check the current rules first.'
  fr:
    name: Le Morne Brabant
    summary: >-
      Une montagne de basalte de 556 mètres à la pointe sud-ouest de l’île,
      refuge des esclaves marrons et site du patrimoine mondial de l’UNESCO.
    hoursNote: 'L’accès à la randonnée est parfois réglementé : renseignez-vous avant.'
