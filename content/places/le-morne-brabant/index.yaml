content:
  en:
    name: Le Morne Brabant
    summary: >-
      A basalt mountain, 556 metres high, at the southwest tip of the island, a
      refuge for people escaping slavery and a UNESCO World Heritage Site.
    hoursNote: 'Hiking access is regulated at times: check the current rules first.'
  fr:
    name: Le Morne Brabant
    summary: >-
      Une montagne de basalte de 556 mètres à l’extrémité sud de la côte ouest,
      refuge des esclaves marrons et site du patrimoine mondial de l’UNESCO.
    hoursNote: >-
      L’accès à la randonnée est parfois réglementé : vérifiez les règles avant
      de partir.
