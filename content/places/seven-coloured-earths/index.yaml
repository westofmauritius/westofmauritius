content:
  en:
    name: Seven Coloured Earths
    summary: >-
      Small dunes of sand in seven distinct colours, formed from weathered
      volcanic rock, the best known sight of Chamarel.
    hoursNote: Entrance fee. Check opening times before you go.
  fr:
    name: Terre des Sept Couleurs
    summary: >-
      De petites dunes de sable de sept couleurs distinctes, nées de la roche
      volcanique décomposée, le site le plus célèbre de Chamarel.
    hoursNote: Entrée payante. Vérifiez les horaires avant de venir.
