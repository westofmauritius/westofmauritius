content:
  en:
    name: Île aux Bénitiers
    summary: >-
      A low coral islet in the lagoon off La Gaulette, with white beaches facing
      Le Morne Brabant, reached by boat.
    hoursNote: Reached by boat from La Gaulette and nearby villages.
  fr:
    name: Île aux Bénitiers
    summary: >-
      Un îlot corallien plat dans le lagon de La Gaulette, aux plages blanches
      face au Morne Brabant, accessible en bateau.
    hoursNote: Accès en bateau depuis La Gaulette et les villages voisins.
