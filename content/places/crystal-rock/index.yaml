content:
  en:
    name: Crystal Rock
    summary: >-
      A pale fossil coral rock rising from clear shallow water in the lagoon. It
      is one of the most photographed sights in Mauritius.
    hoursNote: Reached by boat usually with Île aux Bénitiers.
  fr:
    name: Crystal Rock
    summary: >-
      Un rocher de corail fossile clair qui émerge d’une eau limpide et peu
      profonde dans le lagon, l’un des sites les plus photographiés de Maurice.
    hoursNote: Accès en bateau, généralement avec l’île aux Bénitiers.
