content:
  en:
    name: Alexandra Falls
    summary: >-
      A viewpoint on the Plaine Champagne plateau some 700 metres up. It looks
      across native forest to a waterfall and down towards the south coast.
    hoursNote: Open access. A short walk from the car park.
  fr:
    name: Chutes d’Alexandra
    summary: >-
      Un point de vue sur le plateau de Plaine Champagne, à quelque 700 mètres
      d’altitude, face à une cascade dans la forêt indigène et à la côte sud au
      loin.
    hoursNote: Accès libre. Courte marche depuis le parking.
