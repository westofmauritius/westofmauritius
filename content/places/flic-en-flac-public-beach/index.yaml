content:
  en:
    name: Flic en Flac public beach
    summary: >-
      The heart of one of the island's longest beaches: white sand under filao
      trees, a calm lagoon and sunsets over the open ocean.
    hoursNote: Public beach, open to everyone.
  fr:
    name: Plage publique de Flic en Flac
    summary: >-
      Le cœur de l’une des plus longues plages de l’île : du sable blanc sous
      les filaos, un lagon calme et des couchers de soleil sur le grand large.
    hoursNote: Plage publique, ouverte à tous.
