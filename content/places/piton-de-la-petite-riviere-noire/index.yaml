content:
  en:
    name: Piton de la Petite Rivière Noire
    summary: >-
      At 828 metres, the highest summit in Mauritius: a rewarding hike with
      views across the gorges to the west coast.
    hoursNote: Open access. Start early and avoid the hike in wet weather.
  fr:
    name: Piton de la Petite Rivière Noire
    summary: >-
      Avec ses 828 mètres, le plus haut sommet de Maurice, une belle randonnée
      avec vue sur les gorges et la côte ouest.
    hoursNote: Accès libre. Partez tôt et évitez la randonnée par temps humide.
