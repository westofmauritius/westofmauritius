content:
  en:
    name: Tamarin salt pans
    summary: >-
      Shallow basins where seawater was left to evaporate in the sun. For a long
      time they were the island's main source of salt and they are a piece of
      coastal heritage.
    hoursNote: Visible from the road. Ask before entering the basins.
  fr:
    name: Salines de Tamarin
    summary: >-
      Des bassins peu profonds où l’eau de mer s’évaporait au soleil, longtemps
      la principale source de sel de l’île, et un morceau de patrimoine côtier.
    hoursNote: Visibles depuis la route. Demandez avant d’entrer dans les bassins.
