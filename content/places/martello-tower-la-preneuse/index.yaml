content:
  en:
    name: Martello tower, La Preneuse
    summary: >-
      A round basalt fort built by the British in 1832 and 1833 to guard against
      a French return, the best preserved of the island's Martello towers, now a
      museum.
    hoursNote: Entrance fee. Check opening times before you go.
  fr:
    name: Tour Martello de La Preneuse
    summary: >-
      Un fort rond en basalte construit par les Britanniques en 1832 et 1833
      pour parer à un retour français, la mieux conservée des tours Martello de
      l’île, devenue musée.
    hoursNote: Entrée payante. Vérifiez les horaires avant de venir.
