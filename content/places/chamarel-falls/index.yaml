content:
  en:
    name: Chamarel Falls
    summary: >-
      A river plunging about 95 metres over a sheer basalt cliff into a forested
      pool — the most spectacular waterfall on the island.
    hoursNote: Entrance fee. Check opening times before you go.
  fr:
    name: Cascade de Chamarel
    summary: >-
      Une rivière qui chute d’environ 95 mètres le long d’une falaise de basalte
      dans un bassin entouré de forêt — la cascade la plus spectaculaire de
      l’île.
    hoursNote: Entrée payante. Vérifiez les horaires avant de venir.
