content:
  en:
    name: Tamarin Bay
    summary: >-
      A wide bay with a public beach and a famous surf break and the mountains
      of the west behind it. It is at its best in the early morning and at
      sunset.
    hoursNote: Public beach and open to everyone.
  fr:
    name: Baie de Tamarin
    summary: >-
      Une large baie avec sa plage publique, un spot de surf célèbre et les
      montagnes de l’ouest en toile de fond, magnifique au petit matin et au
      coucher du soleil.
    hoursNote: Plage publique, ouverte à tous.
