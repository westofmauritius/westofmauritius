    summary: >-
      A memorial at the foot of Le Morne Brabant to the people who escaped
      slavery and found refuge on the mountain.
    hoursNote: 'Open access. A place of remembrance: please be respectful.'
  fr:
    name: Monument de la Route de l’esclave
    summary: >-
      Un mémorial au pied du Morne Brabant, dédié à ceux qui ont fui l’esclavage
      et trouvé refuge sur la montagne.
    hoursNote: 'Accès libre. Un lieu de mémoire : merci de le respecter.'
