content:
  en:
    name: Black River Gorges National Park
    summary: >-
      The largest national park in Mauritius: 67 km² of native forest, ravines
      and waterfalls, some 60 km of trails, and the island's rarest birds.
    hoursNote: Free entry. Trails are best walked in the morning.
  fr:
    name: Parc national des Gorges de Rivière Noire
    summary: >-
      Le plus grand parc national de Maurice : 67 km² de forêt indigène, de
      ravins et de cascades, quelque 60 km de sentiers et les oiseaux les plus
      rares de l’île.
    hoursNote: Entrée libre. Les sentiers se parcourent de préférence le matin.
